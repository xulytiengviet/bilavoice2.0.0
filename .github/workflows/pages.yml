name: BilaVoice | Validate and Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify CVNSS Unicode Base27 bridge and deterministic 27-FSK
        run: npm test
      - name: Check frontend JS syntax
        run: node --check assets/app.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python cloud and local API syntax
        run: python -m compileall -q server
  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static application
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
